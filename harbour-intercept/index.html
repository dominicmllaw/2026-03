<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Harbour Intercept</title>
  <link rel="stylesheet" href="css/student.css">
</head>
<body class="loading">

  <!-- ═══════════════════════════════════════════════════════════════════════
       PAIR SELECTION
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="screen-pair-select" class="screen">
    <div class="card">
      <h1>HARBOUR<br>INTERCEPT</h1>
      <h2>Select your pair</h2>

      <div class="form-group">
        <label for="pair-select">Pair Number</label>
        <select id="pair-select">
          <option value="">— Select pair —</option>
        </select>
      </div>

      <div class="form-group">
        <label for="name1-select">Your name</label>
        <select id="name1-select">
          <option value="">— Select name —</option>
        </select>
      </div>

      <div class="form-group">
        <label for="name2-select">Partner's name</label>
        <select id="name2-select">
          <option value="">— Select name —</option>
        </select>
      </div>

      <button id="btn-enter" class="btn btn-primary" disabled>ENTER</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       STANDBY
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="screen-standby" class="screen">
    <div class="card card-center">
      <div class="pair-badge" id="standby-pair-badge"></div>
      <h2>STANDBY</h2>
      <p class="text-muted">Waiting for teacher to start…</p>
      <div class="pulse-dot"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       S1 GATE — SUPPLY SHIFT
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="screen-s1gate" class="screen">
    <div class="card">
      <div class="screen-header">
        <span id="s1-phase-badge" class="phase-badge">PHASE</span>
        <span class="step-label">STEP 1 — SUPPLY SHIFT</span>
      </div>
      <p id="s1-instruction" class="instruction"></p>
      <div class="table-scroll">
        <table id="s1-table" class="schedule-table">
          <thead>
            <tr>
              <th>Price ($)</th>
              <th>Qd</th>
              <th>Original Qs</th>
              <th>New Qty Supplied</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <button id="btn-s1-unlock" class="btn btn-primary" disabled>UNLOCK →</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       SOLVE — FIND EQUILIBRIUM
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="screen-solve" class="screen">
    <div class="card">
      <div class="screen-header">
        <span id="solve-phase-badge" class="phase-badge">PHASE</span>
        <span class="step-label">STEP 2 — FIND EQUILIBRIUM</span>
      </div>
      <div id="solve-form-container"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       TARGET — CHOOSE YOUR TARGET
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="screen-target" class="screen">
    <div class="card">
      <div class="screen-header">
        <span id="target-phase-badge" class="phase-badge">PHASE</span>
        <span class="step-label">STEP 3 — TARGET</span>
      </div>
      <p class="target-prompt">Who bears the greater burden of this tax?</p>
      <div class="target-buttons">
        <button id="btn-consumer" class="btn btn-consumer btn-target">
          CONSUMER<br>SHIELD
        </button>
        <button id="btn-producer" class="btn btn-producer btn-target">
          PRODUCER<br>ARMOUR
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       LOCKED
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="screen-locked" class="screen">
    <div class="card card-center">
      <div class="lock-icon">[ LOCKED ]</div>
      <h2>SUBMITTED</h2>
      <p class="text-muted">Watch the projector.</p>
      <div id="locked-summary" class="locked-summary"></div>
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
