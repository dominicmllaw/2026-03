<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbour Intercept — Projector</title>
  <link rel="stylesheet" href="css/projector.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════
       PROJECTOR MAIN DISPLAY
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="projector-main">

    <div id="phase-indicator">STANDBY — PREPARING TO LAUNCH</div>

    <div id="boss-display">
      <div class="boss-name">THE ANGEL</div>
      <div id="damage-popup"></div>
      <div id="hp-container">
        <div class="hp-label">ANGEL HP</div>
        <div id="hp-bar-track">
          <div id="hp-bar-fill" class="hp-high"></div>
        </div>
        <div id="hp-value">27 / 27</div>
      </div>
    </div>

    <div id="submission-counter"></div>

    <!-- Reveal results -->
    <div id="reveal-results" class="hidden">
      <div id="result-a" class="result-bar result-bar-a"></div>
      <div id="result-b" class="result-bar result-bar-b"></div>
      <div id="result-c" class="result-bar result-bar-c"></div>
    </div>

  </div>

  <!-- Full-screen retaliation flash -->
  <div id="retaliation-overlay"></div>

  <!-- Impact flash (white) — fires when ammo hits the Angel -->
  <div id="impact-flash"></div>

  <!-- EVA alert overlay — blinks red during last 15 s of any countdown -->
  <div id="eva-overlay"></div>

  <!-- End game overlay (shown after Phase 3 reveal) -->
  <div id="endgame-overlay" class="hidden">
    <div id="endgame-title"></div>
    <div id="endgame-subtitle"></div>
    <div id="endgame-ammo-summary" class="hidden"></div>
    <div id="endgame-best-pilots" class="hidden"></div>
  </div>

  <!-- Floating toggle button for touch devices (iPad/iPhone) -->
  <button id="btn-toggle-panel" title="Toggle teacher panel">T</button>

  <!-- ═══════════════════════════════════════════════════════════════════════
       TEACHER CONTROL PANEL  (press T to toggle)
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="teacher-panel">
    <div class="panel-title">COMBAT OPERATIONS · press T or tap button to hide</div>
    <div class="panel-section">
      <button class="btn-panel"            id="btn-phase0">Standby</button>
      <button class="btn-panel btn-phase1" id="btn-phase1">→ Engagement 1</button>
      <button class="btn-panel btn-phase2" id="btn-phase2">→ Engagement 2</button>
      <button class="btn-panel btn-phase3" id="btn-phase3">→ Engagement 3</button>
    </div>
    <div class="panel-section">
      <button class="btn-panel btn-reveal" id="btn-reveal">Trigger Reveal</button>
      <button class="btn-panel btn-reset"  id="btn-reset">Reset Game</button>
    </div>
    <div id="ammo-summary" class="hidden">
      <div class="panel-title">AMMO SUMMARY</div>
      <table id="ammo-table">
        <thead>
          <tr>
            <th>Engagement</th>
            <th>Total Ammo</th>
            <th>HIT</th>
            <th>MISSED</th>
          </tr>
        </thead>
        <tbody id="ammo-tbody"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="js/projector.js"></script>
</body>
</html>
